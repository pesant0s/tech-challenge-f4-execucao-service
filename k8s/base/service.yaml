apiVersion: v1
kind: Service
metadata:
  name: execucao-service
spec:
  # Porta fixa: o NLB da plataforma aponta para a 30081 (contrato de infraestrutura).
  type: NodePort
  selector:
    app.kubernetes.io/name: execucao-service
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
      protocol: TCP
