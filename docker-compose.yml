# Desenvolvimento local, com hot-reload. Produção roda no EKS.
services:
  api:
    build: .
    container_name: execucao-api
    ports:
      - "8002:8000"
    env_file: .env
    environment:
      PYTHONPATH: /app
      LOG_FORMAT: console
    volumes:
      - .:/app
      - /app/.venv
      - /app/__pycache__
    entrypoint: ["sh", "-c"]
    command:
      - |
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload \
          --reload-exclude '**/.venv*/**' \
          --reload-exclude '**/__pycache__/**' \
          --reload-exclude '**/tests/**'
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.1-alpine
    container_name: execucao-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: oficina
      RABBITMQ_DEFAULT_PASS: oficina
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  db:
    image: postgres:16-alpine
    container_name: execucao-db
    env_file: .env
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-execucao}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
